<ng-template #menu let-modal>
  <div class="fondo-negro">
    <div class="btn_cerrar" (click)="modal.close()"><span>x</span></div>
    <a routerLink="inicio" class="item" id="item6" (click)="modal.close()"
      >Inicio</a
    >
    <a href="programacion" class="item" id="item5" (click)="modal.close()"
      >Programación</a
    >
    <a href="formacion" class="item" id="item4" (click)="modal.close()"
      >Formación y Proyectos</a
    >
    <a
      href="emprendimientos"
      class="item hidden"
      id="item3"
      (click)="modal.close()"
      >Emprendimientos</a
    >
    <a href="twitch" class="item hidden" id="item2" (click)="modal.close()"
      >Twitch</a
    >
  </div>
</ng-template>

<div class="btn_menu" (click)="modal.open(menu)">
  <div class="linea" id="linea1"></div>
  <div class="linea" id="linea2"></div>
  <div class="linea" id="linea3"></div>
</div>

<header>
  <img
    class="logotipo"
    (click)="alInicio()"
    src="assets/images/lukitasedits/isologotipo.png"
  />
  <nav class="items">
    <div class="item" routerLink="/inicio" routerLinkActive="active">
      <span>Inicio</span>
      <div class="linea"></div>
    </div>
    <div class="item" routerLink="/programacion" routerLinkActive="active">
      <span>Programación</span>
      <div class="linea"></div>
    </div>
    <div class="item" routerLink="/formacion" routerLinkActive="active">
      <span>Formación y Proyectos</span>
      <div class="linea"></div>
    </div>
    <div
      class="item hidden"
      routerLink="/emprendimientos"
      routerLinkActive="active"
    >
      <span>Emprendimientos</span>
      <div class="linea"></div>
    </div>
    <div class="item hidden" routerLink="/twitch" routerLinkActive="active">
      <span>Twitch</span>
      <div class="linea"></div>
    </div>
  </nav>
</header>
